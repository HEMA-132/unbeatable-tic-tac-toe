apiVersion: apps/v1
kind: Deployment
metadata:
  name: unbeatable-tic-tac-toe
  labels:
    app: unbeatable-tic-tac-toe
spec:
  replicas: 2
  selector:
    matchLabels:
      app: unbeatable-tic-tac-toe
  template:
    metadata:
      labels:
        app: unbeatable-tic-tac-toe
    spec:
      containers:
        - name: web
          image: unbeatable-tic-tac-toe:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 250m
              memory: 128Mi
